<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wing again - 나 다시 날아갈래</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --accent-color: #8ce0ff;
            --accent-hover: #b8efff;
            --text-color: #ffffff;
            --text-sub: #a0aec0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background-color: rgba(11, 19, 43, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
            text-decoration: none;
        }

        /* 찌그러짐을 방지하는 정비율 고정 아이콘 CSS */
        .logo-icon-box {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon-box svg {
            width: 100%;
            height: 100%;
            aspect-ratio: 1 / 1;
        }

        nav a {
            color: var(--text-sub);
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.3s;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .hero {
            text-align: center;
            padding: 5rem 1rem;
            background: radial-gradient(circle at center, #1c2541 0%, #0b132b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 메인 중앙 아이콘 찌그러짐 방지 */
        .hero-icon-box {
            width: 140px;
            height: 140px;
            margin-bottom: 1.5rem;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-icon-box svg {
            width: 100%;
            height: 100%;
            aspect-ratio: 1 / 1;
        }

        .hero h1 {
            font-size: 3rem;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 1.5rem;
            color: var(--text-sub);
            margin-bottom: 2rem;
        }

        .services {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 2rem 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px rgba(140, 224, 255, 0.15);
        }

        .card-emoji {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            display: block;
        }

        .card h2 {
            font-size: 1.35rem;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .card p {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-bottom: 1.8rem;
        }

        .btn {
            display: inline-block;
            padding: 0.7rem 1.4rem;
            background-color: var(--accent-color);
            color: #0b132b;
            font-weight: 700;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s;
            font-size: 0.9rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        footer {
            text-align: center;
            padding: 2.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- 재활용 + 드론 1:1 정비율 하늘색 SVG 로고 정의 -->
    <svg style="display: none;">
        <symbol id="drone-recycle-icon" viewBox="0 0 500 500">
            <!-- 둥근 모서리 사각형 테두리 -->
            <rect x="25" y="25" width="450" height="450" rx="100" fill="none" stroke="#8ce0ff" stroke-width="24"/>
            
            <!-- 순환 재활용 화살표 -->
            <path d="M 220 90 L 320 90 C 350 90 370 105 385 130 L 415 185 C 430 210 425 235 405 255 L 380 280" fill="none" stroke="#8ce0ff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 380 200 L 420 240 L 360 245" fill="none" stroke="#8ce0ff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
            
            <path d="M 390 280 L 330 380 C 310 405 285 415 250 415 L 180 415 C 150 415 130 400 115 375 L 85 320" fill="none" stroke="#8ce0ff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 130 365 L 80 370 L 90 315" fill="none" stroke="#8ce0ff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
            
            <path d="M 85 240 L 125 150 C 140 120 165 100 210 100 L 250 100" fill="none" stroke="#8ce0ff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 110 170 L 125 120 L 175 140" fill="none" stroke="#8ce0ff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- 드론 구조체 -->
            <g transform="translate(0, 0)">
                <!-- 프레임 (X축) -->
                <line x1="175" y1="175" x2="325" y2="325" stroke="#8ce0ff" stroke-width="20" stroke-linecap="round"/>
                <line x1="325" y1="175" x2="175" y2="325" stroke="#8ce0ff" stroke-width="20" stroke-linecap="round"/>
                
                <!-- 본체 중앙 카메라 -->
                <circle cx="250" cy="250" r="50" fill="#0b132b" stroke="#8ce0ff" stroke-width="20"/>
                <circle cx="250" cy="250" r="18" fill="#8ce0ff"/>
                
                <!-- 프로펠러 모듈 4개 -->
                <circle cx="160" cy="160" r="14" fill="#0b132b" stroke="#8ce0ff" stroke-width="12"/>
                <line x1="110" y1="160" x2="210" y2="160" stroke="#8ce0ff" stroke-width="14" stroke-linecap="round"/>
                
                <circle cx="340" cy="160" r="14" fill="#0b132b" stroke="#8ce0ff" stroke-width="12"/>
                <line x1="290" y1="160" x2="390" y2="160" stroke="#8ce0ff" stroke-width="14" stroke-linecap="round"/>
                
                <circle cx="160" cy="340" r="14" fill="#0b132b" stroke="#8ce0ff" stroke-width="12"/>
                <line x1="110" y1="340" x2="210" y2="340" stroke="#8ce0ff" stroke-width="14" stroke-linecap="round"/>
                
                <circle cx="340" cy="340" r="14" fill="#0b132b" stroke="#8ce0ff" stroke-width="12"/>
                <line x1="290" y1="340" x2="390" y2="340" stroke="#8ce0ff" stroke-width="14" stroke-linecap="round"/>
            </g>
        </symbol>
    </svg>

    <header>
        <a href="#" class="logo">
            <div class="logo-icon-box">
                <svg viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet"><use href="#drone-recycle-icon"/></svg>
            </div>
            <span>wing again</span>
        </a>
        <nav>
            <a href="#services">서비스</a>
            <a href="#contact">문의하기</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-icon-box">
            <svg viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet"><use href="#drone-recycle-icon"/></svg>
        </div>
        <h1>wing again</h1>
        <p>나 다시 날아갈래</p>
    </section>

    <section class="services" id="services">
        <div class="card">
            <span class="card-emoji">🛍️</span>
            <h2>사줘드론</h2>
            <p>신상 및 인기 드론 맞춤 구매 가이드</p>
            <button class="btn" onclick="alert('사줘드론 서비스 문의 페이지 준비 중입니다!')">구매 문의</button>
        </div>

        <div class="card">
            <span class="card-emoji">🛠️</span>
            <h2>고쳐드론</h2>
            <p>고장 난 드론 정밀 점검 및 수리</p>
            <button class="btn" onclick="alert('고쳐드론 서비스 문의 페이지 준비 중입니다!')">수리 접수</button>
        </div>

        <div class="card">
            <span class="card-emoji">🤝</span>
            <h2>빌려드론</h2>
            <p>필요한 만큼 단기 / 장기 대여</p>
            <button class="btn" onclick="alert('빌려드론 서비스 문의 페이지 준비 중입니다!')">대여 신청</button>
        </div>

        <div class="card">
            <span class="card-emoji">🏷️</span>
            <h2>팔아드론</h2>
            <p>안 쓰는 중고 드론 최고가 매입</p>
            <button class="btn" onclick="alert('팔아드론 서비스 문의 페이지 준비 중입니다!')">매입 신청</button>
        </div>
    </section>

    <footer id="contact">
        <p>© 2026 wing again. All rights reserved.</p>
    </footer>

</body>
</html>
