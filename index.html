<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wing again - 나 다시 날아갈래</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --accent-color: #8ce0ff;
            --accent-hover: #b8efff;
            --text-color: #ffffff;
            --text-sub: #a0aec0;
            --price-color: #ffd166;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background-color: rgba(11, 19, 43, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
            text-decoration: none;
        }

        /* 찌그러짐 원천 방지를 위한 1:1 정비율 박스 */
        .logo-icon-box {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            aspect-ratio: 1 / 1;
        }

        .logo-icon-box svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        nav a {
            color: var(--text-sub);
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.3s;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .hero {
            text-align: center;
            padding: 4.5rem 1rem 3.5rem;
            background: radial-gradient(circle at center, #1c2541 0%, #0b132b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-icon-box {
            width: 130px;
            height: 130px;
            margin-bottom: 1.5rem;
            flex-shrink: 0;
            aspect-ratio: 1 / 1;
        }

        .hero-icon-box svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .hero h1 {
            font-size: 3rem;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 1.4rem;
            color: var(--text-sub);
            margin-bottom: 1rem;
        }

        .services {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2.5rem 1rem 4rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.8rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 2rem 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-color);
            box-shadow: 0 12px 24px rgba(140, 224, 255, 0.15);
        }

        .card-emoji {
            font-size: 3rem;
            margin-bottom: 0.8rem;
            display: block;
        }

        .card h2 {
            font-size: 1.4rem;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .card p {
            font-size: 0.92rem;
            color: var(--text-sub);
            margin-bottom: 1.2rem;
            min-height: 2.8em;
        }

        .card-price {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--price-color);
            background-color: rgba(255, 209, 102, 0.1);
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            margin-bottom: 1.2rem;
            border: 1px dashed rgba(255, 209, 102, 0.3);
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.8rem 1rem;
            background-color: var(--accent-color);
            color: #0b132b;
            font-weight: 700;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s;
            font-size: 0.95rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        footer {
            text-align: center;
            padding: 2.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- 완벽하게 비율이 잡힌 재활용 + 드론 SVG 심볼 정의 -->
    <svg style="display: none;">
        <symbol id="drone-recycle-icon" viewBox="0 0 100 100">
            <!-- 외곽 둥근 모서리 사각형 테두리 -->
            <rect x="6" y="6" width="88" height="88" rx="20" fill="none" stroke="#8ce0ff" stroke-width="4"/>
            
            <!-- 순환 재활용 화살표 3개 -->
            <path d="M 45 20 A 30 30 0 0 1 74 42" fill="none" stroke="#8ce0ff" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M 68 36 L 76 43 L 79 33" fill="none" stroke="#8ce0ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

            <path d="M 76 56 A 30 30 0 0 1 32 75" fill="none" stroke="#8ce0ff" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M 39 74 L 30 78 L 36 68" fill="none" stroke="#8ce0ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

            <path d="M 26 62 A 30 30 0 0 1 38 23" fill="none" stroke="#8ce0ff" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M 34 29 L 39 21 L 45 28" fill="none" stroke="#8ce0ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- 정중앙 드론 아이콘 -->
            <g transform="translate(0, 0)">
                <line x1="36" y1="36" x2="64" y2="64" stroke="#8ce0ff" stroke-width="3.5" stroke-linecap="round"/>
                <line x1="64" y1="36" x2="36" y2="64" stroke="#8ce0ff" stroke-width="3.5" stroke-linecap="round"/>
                
                <circle cx="50" cy="50" r="9" fill="#0b132b" stroke="#8ce0ff" stroke-width="3"/>
                <circle cx="50" cy="50" r="3" fill="#8ce0ff"/>
                
                <circle cx="32" cy="32" r="2.5" fill="#0b132b" stroke="#8ce0ff" stroke-width="1.8"/>
                <line x1="24" y1="32" x2="40" y2="32" stroke="#8ce0ff" stroke-width="2" stroke-linecap="round"/>
                
                <circle cx="68" cy="32" r="2.5" fill="#0b132b" stroke="#8ce0ff" stroke-width="1.8"/>
                <line x1="60" y1="32" x2="76" y2="32" stroke="#8ce0ff" stroke-width="2" stroke-linecap="round"/>
                
                <circle cx="32" cy="68" r="2.5" fill="#0b132b" stroke="#8ce0ff" stroke-width="1.8"/>
                <line x1="24" y1="68" x2="40" y2="68" stroke="#8ce0ff" stroke-width="2" stroke-linecap="round"/>
                
                <circle cx="68" cy="68" r="2.5" fill="#0b132b" stroke="#8ce0ff" stroke-width="1.8"/>
                <line x1="60" y1="68" x2="76" y2="68" stroke="#8ce0ff" stroke-width="2" stroke-linecap="round"/>
            </g>
        </symbol>
    </svg>

    <header>
        <a href="#" class="logo">
            <div class="logo-icon-box">
                <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"><use href="#drone-recycle-icon"/></svg>
            </div>
            <span>wing again</span>
        </a>
        <nav>
            <a href="#services">서비스</a>
            <a href="#contact">문의하기</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-icon-box">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"><use href="#drone-recycle-icon"/></svg>
        </div>
        <h1>wing again</h1>
        <p>나 다시 날아갈래</p>
    </section>

    <section class="services" id="services">
        <div class="card">
            <div>
                <span class="card-emoji">🛍️</span>
                <h2>사줘드론</h2>
                <p>신상 및 인기 최신 드론 맞춤 구매 추천 가이드</p>
            </div>
            <div>
                <div class="card-price">최저가 견적 맞춤</div>
                <button class="btn" onclick="alert('사줘드론 서비스 문의 페이지 준비 중입니다!')">구매 문의</button>
            </div>
        </div>

        <div class="card">
            <div>
                <span class="card-emoji">🛠️</span>
                <h2>고쳐드론</h2>
                <p>고장 나거나 파손된 드론 정밀 점검 및 수리</p>
            </div>
            <div>
                <div class="card-price">진단비 무료 / 수리비 최저가</div>
                <button class="btn" onclick="alert('고쳐드론 서비스 문의 페이지 준비 중입니다!')">수리 접수</button>
            </div>
        </div>

        <div class="card">
            <div>
                <span class="card-emoji">🤝</span>
                <h2>빌려드론</h2>
                <p>필요한 날짜만큼 부담 없이 단기 / 장기 대여</p>
            </div>
            <div>
                <div class="card-price">일 15,000원 ~</div>
                <button class="btn" onclick="alert('빌려드론 서비스 문의 페이지 준비 중입니다!')">대여 신청</button>
            </div>
        </div>

        <div class="card">
            <div>
                <span class="card-emoji">🏷️</span>
                <h2>팔아드론</h2>
                <p>더 이상 안 쓰는 중고 드론 즉시 최고가 매입</p>
            </div>
            <div>
                <div class="card-price">당일 정산 / 최고가 매입</div>
                <button class="btn" onclick="alert('팔아드론 서비스 문의 페이지 준비 중입니다!')">매입 신청</button>
            </div>
        </div>
    </section>

    <footer id="contact">
        <p>© 2026 wing again. All rights reserved.</p>
    </footer>

</body>
</html>
