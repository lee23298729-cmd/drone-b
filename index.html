<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wing again - 나 다시 날아갈래</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --accent-color: #8ce0ff;
            --accent-hover: #b8efff;
            --text-color: #ffffff;
            --text-sub: #a0aec0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background-color: rgba(11, 19, 43, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
            text-decoration: none;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
        }

        nav a {
            color: var(--text-sub);
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.3s;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .hero {
            text-align: center;
            padding: 5rem 1rem;
            background: radial-gradient(circle at center, #1c2541 0%, #0b132b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-icon {
            width: 140px;
            height: 140px;
            margin-bottom: 1.5rem;
        }

        .hero h1 {
            font-size: 3rem;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 1.5rem;
            color: var(--text-sub);
            margin-bottom: 2rem;
        }

        .services {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 2rem 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px rgba(140, 224, 255, 0.15);
        }

        .card-emoji {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            display: block;
        }

        .card h2 {
            font-size: 1.35rem;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .card p {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-bottom: 1.8rem;
        }

        .btn {
            display: inline-block;
            padding: 0.7rem 1.4rem;
            background-color: var(--accent-color);
            color: #0b132b;
            font-weight: 700;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s;
            font-size: 0.9rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        footer {
            text-align: center;
            padding: 2.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- 재활용 + 드론 상징 연한 하늘색 라인 SVG 테이프 아이콘 -->
    <svg style="display: none;">
        <symbol id="drone-recycle-icon" viewBox="0 0 500 500">
            <!-- 라운드 모서리 테두리 -->
            <rect x="25" y="25" width="450" height="450" rx="90" fill="none" stroke="#8ce0ff" stroke-width="20"/>
            
            <!-- 재활용 화살표 루프 (Recycle Loop) -->
            <path d="M 230 75 L 340 75 A 35 35 0 0 1 370 95 L 430 200 A 35 35 0 0 1 425 240 L 390 280 M 405 180 L 440 215 L 380 220" fill="none" stroke="#8ce0ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 400 270 L 330 390 A 35 35 0 0 1 300 410 L 180 410 A 35 35 0 0 1 150 390 L 80 270 M 120 380 L 70 385 L 80 325" fill="none" stroke="#8ce0ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 75 240 L 125 140 A 35 35 0 0 1 155 120 L 260 120 M 115 170 L 125 120 L 175 145" fill="none" stroke="#8ce0ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- 드론 본체 (Drone) -->
            <g transform="translate(0, 5)">
                <!-- 모터 프레임 X 축 -->
                <line x1="180" y1="180" x2="320" y2="320" stroke="#8ce0ff" stroke-width="18" stroke-linecap="round"/>
                <line x1="320" y1="180" x2="180" y2="320" stroke="#8ce0ff" stroke-width="18" stroke-linecap="round"/>
                
                <!-- 중앙 카메라 바디 -->
                <circle cx="250" cy="250" r="45" fill="#0b132b" stroke="#8ce0ff" stroke-width="18"/>
                <circle cx="250" cy="250" r="16" fill="#8ce0ff"/>
                
                <!-- 프로펠러 4개 -->
                <!-- 좌상단 -->
                <circle cx="170" cy="170" r="14" fill="#0b132b" stroke="#8ce0ff" stroke-width="10"/>
                <line x1="120" y1="170" x2="220" y2="170" stroke="#8ce0ff" stroke-width="12" stroke-linecap="round"/>
                <!-- 우상단 -->
                <circle cx="330" cy="170" r="14" fill="#0b132b" stroke="#8ce0ff" stroke-width="10"/>
                <line x1="280" y1="170" x2="380" y2="170" stroke="#8ce0ff" stroke-width="12" stroke-linecap="round"/>
                <!-- 좌하단 -->
                <circle cx="170" cy="330" r="14" fill="#0b132b" stroke="#8ce0ff" stroke-width="10"/>
                <line x1="120" y1="330" x2="220" y2="330" stroke="#8ce0ff" stroke-width="12" stroke-linecap="round"/>
                <!-- 우하단 -->
                <circle cx="330" cy="330" r="14" fill="#0b132b" stroke="#8ce0ff" stroke-width="10"/>
                <line x1="280" y1="330" x2="380" y2="330" stroke="#8ce0ff" stroke-width="12" stroke-linecap="round"/>
            </g>
        </symbol>
    </svg>

    <header>
        <a href="#" class="logo">
            <svg class="logo-icon"><use href="#drone-recycle-icon"/></svg>
            <span>wing again</span>
        </a>
        <nav>
            <a href="#services">서비스</a>
            <a href="#contact">문의하기</a>
        </nav>
    </header>

    <section class="hero">
        <svg class="hero-icon"><use href="#drone-recycle-icon"/></svg>
        <h1>wing again</h1>
        <p>나 다시 날아갈래</p>
    </section>

    <section class="services" id="services">
        <div class="card">
            <span class="card-emoji">🛍️</span>
            <h2>사줘드론</h2>
            <p>신상 및 인기 드론 맞춤 구매 가이드</p>
            <button class="btn" onclick="alert('사줘드론 서비스 문의 페이지 준비 중입니다!')">구매 문의</button>
        </div>

        <div class="card">
            <span class="card-emoji">🛠️</span>
            <h2>고쳐드론</h2>
            <p>고장 난 드론 정밀 점검 및 수리</p>
            <button class="btn" onclick="alert('고쳐드론 서비스 문의 페이지 준비 중입니다!')">수리 접수</button>
        </div>

        <div class="card">
            <span class="card-emoji">🤝</span>
            <h2>빌려드론</h2>
            <p>필요한 만큼 단기 / 장기 대여</p>
            <button class="btn" onclick="alert('빌려드론 서비스 문의 페이지 준비 중입니다!')">대여 신청</button>
        </div>

        <div class="card">
            <span class="card-emoji">🏷️</span>
            <h2>팔아드론</h2>
            <p>안 쓰는 중고 드론 최고가 매입</p>
            <button class="btn" onclick="alert('팔아드론 서비스 문의 페이지 준비 중입니다!')">매입 신청</button>
        </div>
    </section>

    <footer id="contact">
        <p>© 2026 wing again. All rights reserved.</p>
    </footer>

</body>
</html>
